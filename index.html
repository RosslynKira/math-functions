<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>高考函数大全 · 高三复习工具</title>
<style>
  :root{
    --bg:#F7F4FA;
    --card:#FFFFFF;
    --soft:#FAF8FD;
    --softer:#F6F2FB;
    --primary:#8B7EC8;
    --primary-soft:#F1EDFA;
    --text:#1D1A2A;
    --muted:#6B6680;
    --muted-2:#9A94AD;
    --border:rgba(139,126,200,0.12);
    --border-soft:rgba(139,126,200,0.08);
    --star:#E8C547;
    --shadow:0 2px 20px rgba(139,126,200,0.08);
    --shadow-hover:0 14px 40px rgba(139,126,200,0.16);
    --ease:cubic-bezier(0.4,0,0.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    font-weight:400;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    min-height:100vh;
  }
  body.no-scroll{overflow:hidden}

  /* MathJax 显示公式间距收紧 */
  mjx-container[jax="CHTML"][display="true"]{margin:0.35em 0 !important}

  /* ===== 顶部导航 ===== */
  .topbar{
    position:sticky;top:0;z-index:60;
    background:rgba(247,244,250,0.82);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid rgba(139,126,200,0.10);
  }
  .navbar{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:18px}
  .brand{display:flex;align-items:center;text-decoration:none;color:var(--primary);font-size:18px;font-weight:200;letter-spacing:-.2px;line-height:1}
  .brand-mark{font-size:18px;font-weight:200;color:var(--primary);letter-spacing:-.2px}
  .search-box{position:relative;flex:1;max-width:360px}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-2);pointer-events:none}
  .search-box input{
    width:100%;padding:10px 16px 10px 40px;border-radius:999px;
    border:1px solid rgba(139,126,200,0.22);background:var(--card);
    color:var(--text);font-size:14px;font-weight:400;outline:none;
    transition:all .3s var(--ease);
  }
  .search-box input::placeholder{color:var(--muted-2);font-weight:300}
  .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(139,126,200,0.12)}

  /* ===== 分类筛选 ===== */
  .catbar{max-width:1200px;margin:0 auto;padding:0 24px 12px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
  .catbar::-webkit-scrollbar{display:none}
  .catbar button{
    flex:0 0 auto;cursor:pointer;padding:4px 2px 9px;border:none;background:transparent;
    color:var(--muted-2);font-size:13.5px;font-weight:400;white-space:nowrap;
    position:relative;transition:color .3s var(--ease);
  }
  .catbar button::after{
    content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:0;height:3px;border-radius:99px;background:var(--primary);transition:width .3s var(--ease);
  }
  .catbar button:hover{color:var(--primary)}
  .catbar button.active{color:var(--primary);font-weight:500}
  .catbar button.active::after{width:70%}

  /* ===== 标题区 ===== */
  .hero{max-width:1200px;margin:0 auto;padding:48px 24px 8px;text-align:left}
  .hero-title{font-size:clamp(32px,6vw,48px);font-weight:250;letter-spacing:-.5px;margin:0;color:var(--text)}
  .hero-sub{margin:8px 0 0;font-size:13px;font-weight:300;color:var(--muted-2);letter-spacing:.3px}

  /* ===== 卡片网格 ===== */
  .grid{max-width:1200px;margin:0 auto;padding:40px 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:90px 0;font-weight:300;font-size:16px}
  .card{
    display:flex;flex-direction:column;min-height:320px;
    background:var(--card);border-radius:24px;padding:20px 20px 18px;
    border:1px solid var(--border-soft);box-shadow:var(--shadow);cursor:pointer;
    transition:all .3s var(--ease);
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover)}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .card-name{font-size:13px;font-weight:400;color:var(--muted-2);letter-spacing:.2px}
  .stars{color:var(--star);letter-spacing:1.5px;font-size:11px;white-space:nowrap}
  .mini-chart{flex:1 1 0;min-height:150px;width:100%;margin-top:12px}
  .card-expr{margin-top:14px;text-align:center;color:var(--text);font-size:15px}

  /* ===== 模态框 ===== */
  .modal{position:fixed;inset:0;z-index:100}
  .modal[hidden]{display:none}
  .modal-backdrop{position:absolute;inset:0;background:rgba(247,244,250,0.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .modal-panel{
    position:absolute;inset:0;margin:auto;width:min(900px,calc(100% - 32px));height:min(92vh,920px);
    display:flex;flex-direction:column;overflow:hidden;background:var(--card);
    border-radius:16px;box-shadow:0 30px 90px rgba(139,126,200,0.20);
    animation:pop .3s var(--ease);
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .modal-close{
    position:absolute;top:16px;right:16px;z-index:6;width:38px;height:38px;border-radius:50%;
    border:1px solid var(--border);background:rgba(255,255,255,0.8);color:var(--muted);
    font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center;
    transition:all .3s var(--ease);
  }
  .modal-close:hover{background:var(--primary-soft);color:var(--text)}
  .modal-content{
    overflow-y:auto;padding:0 40px 64px;
    scrollbar-width:thin;scrollbar-color:rgba(139,126,200,0.25) transparent;
  }
  .modal-content::-webkit-scrollbar{width:4px}
  .modal-content::-webkit-scrollbar-thumb{background:rgba(139,126,200,0.22);border-radius:99px}
  .modal-content::-webkit-scrollbar-track{background:transparent}

  .m-hero{margin:0 -40px 32px;padding:44px 72px 36px 40px;background:linear-gradient(180deg,var(--softer),rgba(255,255,255,0))}
  .m-name{font-size:32px;font-weight:600;color:var(--text);letter-spacing:-.3px}
  .m-expr{margin:10px 0 14px;font-size:19px;color:var(--muted);font-weight:400}
  .m-meta{display:flex;align-items:center;gap:12px}
  .m-cat{font-size:12px;font-weight:500;padding:4px 12px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
  .m-stars{font-size:15px}
  .m-summary{margin:16px 0 0;color:var(--muted);font-size:15px;font-weight:300;line-height:1.85;max-width:680px}

  .m-section{margin-top:34px}
  .m-section h3{
    display:flex;align-items:center;gap:10px;margin:0 0 16px;
    font-size:13px;font-weight:600;color:var(--muted);letter-spacing:2px;
  }
  .sec-no{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:7px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:600;letter-spacing:0}
  .m-section h4{margin:18px 0 8px;font-size:14px;font-weight:500;color:var(--muted)}

  /* 基础信息 */
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .info-item{display:flex;flex-direction:column;gap:5px;padding:16px 18px;border-radius:16px;background:var(--soft);border:1px solid var(--border-soft)}
  .info-item .k{font-size:12px;color:var(--muted-2);letter-spacing:.5px}
  .info-item .v{font-size:15px;color:var(--text);font-weight:400}
  .info-item.full{grid-column:1/-1}

  /* 图像区 */
  .chart-host{height:clamp(320px,52vh,520px);width:100%;border-radius:16px;background:#FFFFFF}
  .chart-fallback{padding:40px;text-align:center;color:var(--muted);font-weight:300}
  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:20px}
  .slider{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:14px 16px;border-radius:14px;background:var(--soft);border:1px solid var(--border-soft)}
  .sl-label{font-size:13px;color:var(--muted);font-weight:400}
  .sl-val{font-size:13px;font-weight:500;color:var(--primary);font-variant-numeric:tabular-nums}
  .slider input[type=range]{
    grid-column:1/-1;width:100%;-webkit-appearance:none;appearance:none;
    height:4px;border-radius:99px;background:#E7E1F1;outline:none;cursor:pointer;margin:4px 0;
  }
  .slider input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;
    background:#fff;border:2px solid var(--primary);box-shadow:0 1px 4px rgba(139,126,200,0.25);cursor:pointer;
  }
  .slider input[type=range]::-moz-range-thumb{
    width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--primary);
    box-shadow:0 1px 4px rgba(139,126,200,0.25);cursor:pointer;
  }
  .slider input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:transparent}
  .feature-summary{margin-top:16px;padding:13px 16px;border-radius:14px;background:var(--primary-soft);color:var(--muted);font-size:13.5px;font-weight:400}

  /* 表格 */
  .table-wrap{overflow-x:auto;border-radius:14px;border:1px solid rgba(139,126,200,0.10);background:var(--card)}
  table{border-collapse:collapse;width:100%;font-size:14px;min-width:460px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border-soft);vertical-align:middle}
  thead th{background:var(--soft);color:var(--muted);font-weight:500;font-size:12.5px;letter-spacing:.3px}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#FCFBFE}
  .al-label{color:var(--muted-2);font-weight:500;white-space:nowrap;min-width:80px}
  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--primary-soft);color:var(--primary);font-weight:500}
  .deriv-formula{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;background:var(--soft);border:1px solid var(--border-soft);margin-bottom:8px}
  .deriv-formula .k{font-size:12px;color:var(--muted-2);letter-spacing:.5px}
  .deriv-formula .formula{font-size:17px;color:var(--primary)}
  .deriv-note{padding:13px 16px;border-radius:14px;background:var(--soft);border:1px solid var(--border-soft);color:var(--muted);font-size:13.5px}
  .steps{margin:6px 0 0;padding-left:20px;color:var(--muted);font-weight:300}
  .steps li{margin:5px 0}

  /* 变形卡片 */
  .tf-card{padding:16px 18px;border-radius:16px;background:var(--soft);border:1px solid var(--border-soft);margin-bottom:14px}
  .tf-type{font-weight:600;font-size:14px;color:var(--primary);letter-spacing:.3px}
  .tf-formula{margin:6px 0 0;color:var(--text)}
  .tf-chart{height:230px;width:100%;margin:12px 0;border-radius:12px;background:#FFFFFF;border:1px solid var(--border-soft)}
  .tf-desc{color:var(--muted);font-size:13.5px;font-weight:300;line-height:1.75;margin-top:8px}
  .tf-examples{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px;font-weight:300}
  .tf-examples li{margin:3px 0}
  .tf-example{margin:6px 0;font-size:14px;color:var(--text)}
  .tf-rule{color:var(--muted);font-size:13.5px;font-weight:300;line-height:1.75}

  /* 易错点 */
  .mistakes{display:grid;gap:12px}
  .mistake{border-radius:16px;overflow:hidden;border:1px solid var(--border-soft);background:var(--card)}
  .mistake-wrong{padding:13px 16px;color:#B85C7A;font-size:14px;font-weight:300}
  .mistake-correct{padding:13px 16px;color:#4F8B6D;font-size:14px;font-weight:300;background:var(--soft);border-top:1px solid var(--border-soft)}

  /* 例题 */
  .example{padding:18px 20px;border-radius:18px;background:var(--card);border:1px solid var(--border-soft);margin-bottom:16px}
  .ex-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .ex-level{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--primary);color:#fff}
  .ex-title{font-weight:500;font-size:15.5px;color:var(--text)}
  .ex-source{margin-top:8px;font-size:12.5px;color:var(--muted-2);font-weight:300}
  .ex-k{margin-top:5px;font-size:12.5px;color:var(--muted);font-weight:300}
  .ex-q{margin-top:12px;padding:14px 16px;border-radius:14px;background:var(--softer);border-left:3px solid var(--primary);font-size:14px;color:var(--text);line-height:1.85}
  .ex-s{margin-top:12px;font-size:14px;color:#3E3A50;line-height:1.85;font-weight:300}
  .ex-q b,.ex-s b{margin-right:6px;font-weight:500}

  /* 记忆技巧 */
  .mem-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mem-item{padding:16px 18px;border-radius:16px;background:var(--soft);border:1px solid var(--border-soft)}
  .mem-t{font-weight:500;font-size:13.5px;color:var(--primary);margin-bottom:6px}
  .mem-item p{margin:0;color:var(--muted);font-size:13.5px;font-weight:300;line-height:1.75}

  .footer{text-align:center;color:var(--muted-2);font-size:12.5px;font-weight:300;padding:0 24px 40px}
  .tangent-section{max-width:1200px;margin:0 auto;padding:10px 24px 70px}
  .tangent-title{font-size:28px;font-weight:300;letter-spacing:-.3px;color:var(--text);margin:0 0 6px}
  .tangent-sub{margin:0 0 26px;color:var(--muted);font-weight:300;font-size:15px;max-width:760px;line-height:1.75}
  .tangent-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
  .tangent-card{background:var(--card);border-radius:20px;padding:20px;border:1px solid var(--border-soft);box-shadow:var(--shadow)}
  .tangent-formula{color:var(--primary);font-size:17px;font-weight:500;margin-bottom:4px}
  .tangent-chart{height:240px;width:100%;margin:12px 0;border-radius:12px;background:#fff}
  .tangent-cond{margin:8px 0;font-size:13.5px;color:var(--muted)}
  .tangent-usage{font-size:13.5px;color:var(--muted);font-weight:300;line-height:1.75;border-top:1px dashed var(--border-soft);padding-top:10px}

  @media (max-width:720px){
    .navbar{padding:12px 16px}
    .brand{font-size:16px}
    .search-box{max-width:none}
    .hero{padding:40px 16px 4px}
    .grid{grid-template-columns:1fr;padding:28px 16px 60px;gap:16px}
    .modal-panel{width:100%;height:100dvh;border-radius:12px;box-shadow:none}
    .modal-content{padding:0 18px 48px}
    .m-hero{margin:0 -18px 24px;padding:34px 60px 26px 18px}
    .m-name{font-size:25px}
    .m-expr{font-size:16px}
    .info-grid{grid-template-columns:1fr}
    .info-item.full{grid-column:auto}
    .mem-grid{grid-template-columns:1fr}
    .tangent-grid{grid-template-columns:1fr}
    .chart-host{height:280px}
  }
</style>

    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],

<body>
  <div class="topbar">
    <header class="navbar">
      <a class="brand" href="#" onclick="return false"><span class="brand-mark">rek.</span></a>
      <div class="search-box">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-input" type="search" placeholder="搜索函数名或解析式" autocomplete="off">
      </div>
    </header>
    <nav class="catbar" id="catbar"></nav>
  </div>

  <section class="hero">
    <h1 class="hero-title">高考函数大全</h1>
  </section>

  <main class="grid" id="grid"></main>

  <section class="tangent-section" id="tangent-section">
    <h2 class="tangent-title">切线型不等式</h2>
    <p class="tangent-sub">经典切线放缩与函数不等式的母函数图像，母曲线（紫色实线）与切线（浅灰虚线）对照，标注切点与取等条件。</p>
    <div class="tangent-grid" id="tangent-grid"></div>
  </section>

  <footer class="footer">rek. · 高考函数大全 · 支持搜索、分类、参数调节、交互图像与切线型不等式</footer>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel">
      <button class="modal-close" id="modal-close" aria-label="关闭">×</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script>
  "use strict";

  /* =========================================================
     工具函数
  ========================================================= */
  function fmt(n){
    if(typeof n !== "number" || !isFinite(n)) return String(n);
    const r = Math.round(n * 1000) / 1000;
    return (Object.is(r, -0) ? 0 : r).toString();
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function quadraticRoots(a, b, c){
    if(Math.abs(a) < 1e-9){
      if(Math.abs(b) < 1e-9) return [];
      return [-c / b];
    }
    const d = b * b - 4 * a * c;
    if(d < -1e-9) return [];
    if(Math.abs(d) < 1e-9) return [-b / (2 * a)];
    const s = Math.sqrt(d);
    return [(-b - s) / (2 * a), (-b + s) / (2 * a)].sort((m, n) => m - n);
  }

  function renderStars(n){
    let s = "";
    for(let i = 1; i <= 5; i++) s += (i <= n ? "★" : "☆");
    return '<span class="stars" aria-label="' + n + '星">' + s + "</span>";
  }

  const TANGENT_STEPS = [
    String.raw`① 求导得 $f'(x)$。`,
    String.raw`② 求切点横坐标 $x_0$ 处的斜率 $k=f'(x_0)$。`,
    String.raw`③ 求切点纵坐标 $y_0=f(x_0)$。`,
    String.raw`④ 点斜式写出切线：$y-y_0=k(x-x_0)$。`
  ];

  /* =========================================================
     数据模型（结构化对象，方便扩展）
     新增函数：向 FUNCTION_DATA 中 push 一个对象即可。
     公式字段统一用 LaTeX 存储：expr / basic / derivative 存纯 LaTeX，
     其余文本字段内嵌 $...$ 行内公式；渲染时不做转义，交给 MathJax。
  ========================================================= */
  const CATEGORIES = [
    "全部","一次函数","二次函数","反比例函数","指数函数","对数函数",
    "三角函数","幂函数","对勾函数","分式函数","复合函数","含绝对值函数"
  ];

  const FUNCTION_DATA = [
    {
      id: "quadratic",
      name: "二次函数",
      category: "二次函数",
      color: "#8B7EC8",
      expr: String.raw`y=ax^2+bx+c \quad (a\ne 0)`,
      search: ["二次函数","抛物线","ax^2","ax2","x2","x²","二次","quadratic"],
      stars: 5,
      xRange: [-6, 6],
      params: {
        a: { label: "a（开口 / 形状）", min: -3, max: 3, step: 0.1, default: 1 },
        b: { label: "b（与对称轴相关）", min: -6, max: 6, step: 0.5, default: -4 },
        c: { label: "c（y 轴截距）", min: -6, max: 6, step: 0.5, default: 3 }
      },
      f: (x, p) => p.a * x * x + p.b * x + p.c,
      fp: (x, p) => 2 * p.a * x + p.b,
      features(p){
        const a = p.a, b = p.b, c = p.c;
        const xv = Math.abs(a) < 1e-9 ? 0 : -b / (2 * a);
        const yv = a * xv * xv + b * xv + c;
        const roots = quadraticRoots(a, b, c);
        return {

  /* =========================================================
     ECharts 配置构建（浅色主题）
  ========================================================= */
  function buildChartOption(fn, p, mini){
    const accent = "#8B7EC8";
    const xr = fn.xRange;
    const clip = fn.yClip != null ? fn.yClip : Infinity;
    const N = mini ? 160 : 520;
    const data = [];
    for(let i = 0; i <= N; i++){
      const x = xr[0] + (xr[1] - xr[0]) * i / N;
      const y = fn.f(x, p);
      const xf = Math.round(x * 1e6) / 1e6;
      const ok = isFinite(y) && Math.abs(y) <= clip;
      data.push(ok ? [xf, Math.round(y * 1e6) / 1e6] : [xf, null]);
    }

    const feats = fn.features(p);
    const mpData = [];
    (feats.extrema || []).forEach(e => {
      mpData.push({
        name: e.name, value: e.name, coord: [e.x, e.y],
        symbol: "circle", symbolSize: mini ? 8 : 12,
        itemStyle: { color: accent, borderColor: "#ffffff", borderWidth: 2 },
        label: mini ? { show: false } : {
          show: true, color: "#6B6680", fontSize: 10, position: "top",
          formatter: () => e.name + " (" + fmt(e.x) + ", " + fmt(e.y) + ")"
        }
      });
    });
    (feats.zeros || []).forEach(z => {
      mpData.push({
        name: "零点", value: "零点", coord: [z.x, (z.y != null ? z.y : 0)],
        symbol: "circle", symbolSize: mini ? 6 : 9,
        itemStyle: { color: "#ffffff", borderColor: accent, borderWidth: 2 },
        label: mini ? { show: false } : {
          show: true, color: "#6B6680", fontSize: 10, position: "bottom",
          formatter: () => "x = " + fmt(z.x)
        }
      });
    });
    const mlData = [];
    const oblique = [];
    (feats.asymptotes || []).forEach(a => {
      if(a.type === "vertical") mlData.push({ xAxis: a.x, name: a.name || ("x = " + fmt(a.x)) });
      else if(a.type === "horizontal") mlData.push({ yAxis: a.y, name: a.name || ("y = " + fmt(a.y)) });
      else if(a.type === "oblique" && a.slope != null && a.intercept != null){
        const x1 = xr[0], x2 = xr[1];
        oblique.push({
          name: a.name || ("y = " + fmt(a.slope) + "x " + (a.intercept >= 0 ? "+" : "−") + " " + fmt(Math.abs(a.intercept))),
          data: [[x1, a.slope * x1 + a.intercept], [x2, a.slope * x2 + a.intercept]]
        });
      }
    });

    const axisCommon = {
      axisLine: { lineStyle: { color: "#D8D2E6", width: 1 } },
      axisLabel: { color: "#9A94AD", fontSize: 11 },
      axisTick: { show: false },
      splitLine: { show: false }
    };

    const series = [{
        type: "line",
        name: "y = f(x)",
        data: data,
        showSymbol: false,
        smooth: false,
        step: fn.step || false,
        connectNulls: false,
        lineStyle: { color: accent, width: mini ? 1.5 : 2 },
        areaStyle: {
          color: {
            type: "linear", x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [
              { offset: 0, color: "rgba(139,126,200,0.12)" },
              { offset: 1, color: "rgba(139,126,200,0)" }
            ]
          }
        },
        emphasis: { focus: "none" },
        markPoint: { data: mpData, animation: false },
        markLine: {
          silent: true, symbol: "none", animation: false, data: mlData,
          lineStyle: { color: "#D8D2E6", type: "dashed", width: 1 },
          label: { show: !mini, color: "#9A94AD", fontSize: 10, position: "insideEndTop" }
        }
      }];

    oblique.forEach(o => {
      series.push({
        type: "line",
        name: o.name,
        data: o.data,
        showSymbol: false,
        silent: true,
        z: 5,
        lineStyle: { color: "#D8D2E6", type: "dashed", width: 1 },
        endLabel: { show: !mini, color: "#9A94AD", fontSize: 10, formatter: o.name }
      });
    });

    return {
      animation: false,
      backgroundColor: "transparent",
      grid: { left: mini ? 36 : 54, right: mini ? 12 : 24, top: mini ? 14 : 26, bottom: mini ? 26 : 46 },
      tooltip: mini ? { show: false } : {
        trigger: "axis",
        confine: true,
        backgroundColor: "rgba(255,255,255,0.97)",
        borderColor: accent,
        borderWidth: 1,
        padding: [8, 10],
        textStyle: { color: "#1D1A2A", fontSize: 12 },
        extraCssText: "box-shadow:0 8px 24px rgba(139,126,200,0.18);border-radius:10px;",
        formatter: function(arr){
          let it = Array.isArray(arr) ? (arr.find(q => q.seriesName === "y = f(x)") || arr.find(q => q.seriesType === "line")) : arr;
          if(!it || !it.value || it.value[1] == null) return "";
          const x = it.value[0], y = it.value[1];
          const k = fn.fp(x, p);
          if(!isFinite(k)) return '<div style="min-width:220px"><b style="color:' + accent + '">y = f(x)</b><br>x = ' + fmt(x) + '<br>y = ' + fmt(y) + '<br>（该点不可导）</div>';
          const b = y - k * x;
          return '<div style="min-width:220px"><b style="color:' + accent + '">y = f(x)</b><br>' +
                 "x = " + fmt(x) + "<br>y = " + fmt(y) + "<br>" +
                 "导数值 f′(x) = " + fmt(k) + "<br>切线斜率 k = " + fmt(k) + "<br>" +
                 "切线：y = " + fmt(k) + "x " + (b >= 0 ? "+" : "−") + " " + fmt(Math.abs(b)) + "</div>";
        }
      },
      xAxis: Object.assign({}, axisCommon, {
        type: "value", name: mini ? "" : "x", nameLocation: "end",
        nameTextStyle: { color: "#9A94AD" },
        min: mini ? xr[0] : undefined, max: mini ? xr[1] : undefined
      }),
      yAxis: Object.assign({}, axisCommon, {
        type: "value", name: mini ? "" : "y", nameLocation: "end",
        nameTextStyle: { color: "#9A94AD" },
        min: mini && fn.yRange ? fn.yRange[0] : undefined,
        max: mini && fn.yRange ? fn.yRange[1] : undefined
      }),
      dataZoom: mini ? [] : [
        { type: "inside", xAxisIndex: 0, filterMode: "none", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false },
        { type: "inside", yAxisIndex: 0, filterMode: "none", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false }
      ],
      series: series
    };
  }

  /* =========================================================
     无限缩放（手动滚轮缩放 + 拖拽平移 + 动态重采样）
  ========================================================= */
  function sampleCurve(calcY, xMin, xMax, clip, baseSpan){
    const span = xMax - xMin;
    if(!isFinite(span) || span <= 0) return { data: [], yMin: -1, yMax: 1 };
    const N = Math.max(300, Math.min(3000, Math.round(span * 50)));
    const effClip = (clip != null && isFinite(clip)) ? clip * Math.max(1, baseSpan / span) : Infinity;
    const data = [];
    for(let i = 0; i <= N; i++){
      const x = xMin + span * i / N;
      const y = calcY(x);
      const xf = Math.round(x * 1e6) / 1e6;
      let yy;
      if(!isFinite(y)) yy = null;
      else if(Math.abs(y) > effClip) yy = (y > 0 ? effClip : -effClip);
      else yy = Math.round(y * 1e6) / 1e6;
      data.push([xf, yy]);
    }
    let yMin = Infinity, yMax = -Infinity;
    data.forEach(d => { if(d[1] != null){ yMin = Math.min(yMin, d[1]); yMax = Math.max(yMax, d[1]); } });
    if(!isFinite(yMin)){ yMin = -1; yMax = 1; }
    const pad = (yMax - yMin) * 0.08 || 1;
    return { data: data, yMin: yMin - pad, yMax: yMax + pad };
  }

  function filterFeatures(feats, xMin, xMax, yMin, yMax){
    return {
      extrema: (feats.extrema || []).filter(e => e.x >= xMin && e.x <= xMax),
      zeros: (feats.zeros || []).filter(z => z.x >= xMin && z.x <= xMax),
      asymptotes: (feats.asymptotes || []).filter(a => {
        if(a.type === "vertical") return a.x >= xMin && a.x <= xMax;
        if(a.type === "horizontal") return a.y >= yMin && a.y <= yMax;
        return true;
      })
    };
  }

  function makeZoomableChart(container, buildRangeOption, initialRange){
    const chart = echarts.init(container);
    let view = { xMin: initialRange[0], xMax: initialRange[1] };
    let dragging = false, dStartX = 0, dStartMin = 0, dStartMax = 0, dScale = 1;

    function apply(){
      chart.setOption(buildRangeOption(view.xMin, view.xMax), { notMerge: true });
    }
    apply();

    function xy(e){
      const ev = e.event || e;
      if(ev.clientX != null){
        const r = container.getBoundingClientRect();
        return [ev.clientX - r.left, ev.clientY - r.top];
      }
      return [e.offsetX, e.offsetY];
    }

    const zr = chart.getZr();
    zr.on("mousewheel", function(e){
      const ev = e.event || e;
      if(ev && ev.preventDefault) ev.preventDefault();
      let delta = 0;
      if(ev.wheelDelta != null) delta = ev.wheelDelta;
      else if(ev.detail != null) delta = -ev.detail * 40;
      else if(ev.deltaY != null) delta = -ev.deltaY;
      const factor = delta > 0 ? 0.8 : 1.25;
      const width = Math.max(1, chart.getWidth());
      const frac = Math.min(1, Math.max(0, xy(e)[0] / width));
      const span = view.xMax - view.xMin;
      const xData = view.xMin + span * frac;
      const newSpan = span * factor;
      view.xMin = xData - newSpan * frac;
      view.xMax = xData + newSpan * (1 - frac);
      apply();
    });

    zr.on("mousedown", function(e){
      if((e.event ? e.event.button : e.button) !== 0) return;
      dragging = true;
      dStartX = xy(e)[0];
      dStartMin = view.xMin; dStartMax = view.xMax;
      dScale = (view.xMax - view.xMin) / Math.max(1, chart.getWidth());
    });
    zr.on("mousemove", function(e){
      if(!dragging) return;
      const dx = (xy(e)[0] - dStartX) * dScale;
      view.xMin = dStartMin - dx;
      view.xMax = dStartMax - dx;
      apply();
    });
    function stopDrag(){ dragging = false; }
    zr.on("mouseup", stopDrag);
    zr.on("globalout", stopDrag);

    return {
      chart: chart,
      rerender: function(){ apply(); },
      getView: function(){ return { xMin: view.xMin, xMax: view.xMax }; },
      setView: function(v){ view = { xMin: v.xMin, xMax: v.xMax }; apply(); }
    };
  }

    const series = [{

    }];
    oblique.forEach(o => {

    return {
      animation: false, backgroundColor: "transparent",
      grid: { left: 54, right: 24, top: 26, bottom: 46 },
      tooltip: {
        trigger: "axis", confine: true, backgroundColor: "rgba(255,255,255,0.97)", borderColor: accent, borderWidth: 1, padding: [8, 10], textStyle: { color: "#1D1A2A", fontSize: 12 }, extraCssText: "box-shadow:0 8px 24px rgba(139,126,200,0.18);border-radius:10px;",
        formatter: function(arr){
          let it = Array.isArray(arr) ? (arr.find(q => q.seriesName === "y=f(x)") || arr.find(q => q.seriesType === "line")) : arr;
          if(!it || !it.value || it.value[1] == null) return "";
          const x = it.value[0], y = it.value[1], k = fn.fp(x, p);
          if(!isFinite(k)) return '<div style="min-width:220px"><b style="color:' + accent + '">y=f(x)</b><br>x = ' + fmt(x) + '<br>y = ' + fmt(y) + '<br>（该点不可导）</div>';
          const b = y - k * x;
          return '<div style="min-width:220px"><b style="color:' + accent + '">y=f(x)</b><br>x = ' + fmt(x) + '<br>y = ' + fmt(y) + '<br>导数值 f′(x) = ' + fmt(k) + '<br>切线斜率 k = ' + fmt(k) + '<br>切线：y = ' + fmt(k) + 'x ' + (b >= 0 ? '+' : '−') + ' ' + fmt(Math.abs(b)) + '</div>';
        }
      },
      xAxis: Object.assign({}, axisCommon, { type: "value", name: "x", nameLocation: "end", nameTextStyle: { color: "#9A94AD" }, min: xMin, max: xMax }),
      yAxis: Object.assign({}, axisCommon, { type: "value", name: "y", nameLocation: "end", nameTextStyle: { color: "#9A94AD" }, min: s.yMin, max: s.yMax }),
      series: series
    };
  }

  function buildTransformRangeOption(fn, tr, p, xMin, xMax){
    const accent = "#8B7EC8", gray = "#C7C2D6";
    const baseSpan = fn.xRange[1] - fn.xRange[0];
    const clip = fn.yClip;
    const sF = sampleCurve(x => fn.f(x, p), xMin, xMax, clip, baseSpan);
    const sG = sampleCurve(x => transformG(fn, tr, x, p), xMin, xMax, clip, baseSpan);
    const yMin = Math.min(sF.yMin, sG.yMin), yMax = Math.max(sF.yMax, sG.yMax);
    const axisCommon = { axisLine: { lineStyle: { color: "#D8D2E6", width: 1 } }, axisLabel: { color: "#9A94AD", fontSize: 10 }, axisTick: { show: false }, splitLine: { show: false } };
    return {
      animation: false, backgroundColor: "transparent",
      grid: { left: 34, right: 12, top: 14, bottom: 26 },
      tooltip: {
        trigger: "axis", confine: true, backgroundColor: "rgba(255,255,255,0.97)", borderColor: accent, borderWidth: 1, padding: [6, 8], textStyle: { color: "#1D1A2A", fontSize: 11 }, extraCssText: "box-shadow:0 6px 18px rgba(139,126,200,0.15);border-radius:8px;",
        formatter: function(arr){
          const list = Array.isArray(arr) ? arr : [arr];
          const g = list.find(q => q.seriesName === "变形函数");
          const f = list.find(q => q.seriesName === "母函数");
          if(!g || !g.value || g.value[1] == null) return "";
          return '<div style="min-width:150px">x = ' + fmt(g.value[0]) + '<br><span style="color:' + gray + '">母 f(x) = ' + (f && f.value[1] != null ? fmt(f.value[1]) : "—") + '</span><br><b style="color:' + accent + '">变形 g(x) = ' + fmt(g.value[1]) + '</b></div>';
        }
      },
      xAxis: Object.assign({}, axisCommon, { type: "value", min: xMin, max: xMax }),
      yAxis: Object.assign({}, axisCommon, { type: "value", min: yMin, max: yMax }),
      series: [
        { type: "line", name: "母函数", data: sF.data, showSymbol: false, smooth: false, connectNulls: false, silent: true, lineStyle: { color: gray, type: "dashed", width: 1.2 } },
        { type: "line", name: "变形函数", data: sG.data, showSymbol: false, smooth: false, connectNulls: false, lineStyle: { color: accent, width: 2 }, areaStyle: { color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: "rgba(139,126,200,0.10)" }, { offset: 1, color: "rgba(139,126,200,0)" }] } } }
      ]
    };
  }

  function buildTangentRangeOption(t, xMin, xMax){
    const accent = "#8B7EC8", gray = "#C7C2D6";
    const baseSpan = t.xRange[1] - t.xRange[0];
    const clip = t.yClip;
    const series = [];
    let yMin = Infinity, yMax = -Infinity;
    t.curves.forEach((c, idx) => {
      const s = sampleCurve(x => c.fn(x), xMin, xMax, clip, baseSpan);
      yMin = Math.min(yMin, s.yMin); yMax = Math.max(yMax, s.yMax);
      const primary = idx === 0;
      series.push({ type: "line", name: c.name, data: s.data, showSymbol: false, smooth: false, connectNulls: false, silent: !primary, lineStyle: { color: primary ? accent : gray, type: primary ? "solid" : "dashed", width: primary ? 2.2 : 1.3 } });
    });
    if(t.point){
      series[0].markPoint = { animation: false, data: [{ name: t.point.label, coord: [t.point.x, t.point.y], symbol: "circle", symbolSize: 9, itemStyle: { color: accent, borderColor: "#fff", borderWidth: 2 }, label: { show: true, color: "#6B6680", fontSize: 10, position: "bottom", formatter: t.point.label } }] };
    }
    const axisCommon = { axisLine: { lineStyle: { color: "#D8D2E6", width: 1 } }, axisLabel: { color: "#9A94AD", fontSize: 10 }, axisTick: { show: false }, splitLine: { show: false } };
    return {
      animation: false, backgroundColor: "transparent",
      grid: { left: 34, right: 12, top: 14, bottom: 26 },
      tooltip: {
        trigger: "axis", confine: true, backgroundColor: "rgba(255,255,255,0.97)", borderColor: accent, borderWidth: 1, padding: [6, 8], textStyle: { color: "#1D1A2A", fontSize: 11 }, extraCssText: "box-shadow:0 6px 18px rgba(139,126,200,0.15);border-radius:8px;",
        formatter: function(arr){
          const list = Array.isArray(arr) ? arr : [arr];
          const first = list[0];
          if(!first || !first.value || first.value[1] == null) return "";
          let str = '<div style="min-width:160px">x = ' + fmt(first.value[0]);
          list.forEach(q => { if(q.value && q.value[1] != null) str += '<br><span style="color:' + gray + '">' + q.seriesName + ' = ' + fmt(q.value[1]) + '</span>'; });
          return str + '</div>';

      yAxis: Object.assign({}, axisCommon, { type: "value", min: yMin, max: yMax }),
      series: series
    };
  }

      '<h4>切线方程一般求法</h4>' +

  /* ---- 通用变形求值器 ---- */
  function evalTransform(f, x, p, tr){
    switch(tr.kind){
      case "shiftY":  return f(x, p) + (tr.k || 0);
      case "shiftX":  return f(x - (tr.h || 0), p);
      case "scaleX":  return f((tr.a || 1) * x, p);
      case "scaleY":  return (tr.a || 1) * f(x, p);
      case "absF":    return Math.abs(f(x, p));
      case "absX":    return f(Math.abs(x), p);
      case "negY":    return -f(x, p);
      case "negX":    return f(-x, p);
      case "plus":    return f(x, p) + tr.q(x, p);
      case "minus":   return f(x, p) - tr.q(x, p);
      case "times":   return f(x, p) * tr.q(x, p);
      case "div":     return f(x, p) / tr.q(x, p);
      case "outer":   return tr.q(f(x, p));
      case "inner":   return f(tr.q(x, p), p);
      case "reciprocal": return 1 / f(x, p);
      default: return f(x, p);
    }
  }

  function transformG(fn, tr, x, p){
    if(tr.gfn) return tr.gfn(x, p);
    return evalTransform(fn.f, x, p, tr);
  }

  function buildTransformChartOption(fn, tr, p){
    const accent = "#8B7EC8", gray = "#C7C2D6";
    const xr = fn.xRange;
    const clip = fn.yClip != null ? fn.yClip : Infinity;
    const N = 260;
    const dataF = [], dataG = [];
    for(let i = 0; i <= N; i++){
      const x = xr[0] + (xr[1] - xr[0]) * i / N;
      const xf = Math.round(x * 1e6) / 1e6;
      const yf = fn.f(x, p), yg = transformG(fn, tr, x, p);
      dataF.push(isFinite(yf) && Math.abs(yf) <= clip ? [xf, Math.round(yf * 1e6) / 1e6] : [xf, null]);
      dataG.push(isFinite(yg) && Math.abs(yg) <= clip ? [xf, Math.round(yg * 1e6) / 1e6] : [xf, null]);
    }
    const axisCommon = {
      axisLine: { lineStyle: { color: "#D8D2E6", width: 1 } },
      axisLabel: { color: "#9A94AD", fontSize: 10 },
      axisTick: { show: false },
      splitLine: { show: false }
    };
    return {
      animation: false,
      backgroundColor: "transparent",
      grid: { left: 34, right: 12, top: 14, bottom: 26 },
      tooltip: {
        trigger: "axis", confine: true,
        backgroundColor: "rgba(255,255,255,0.97)", borderColor: accent, borderWidth: 1, padding: [6, 8],
        textStyle: { color: "#1D1A2A", fontSize: 11 },
        extraCssText: "box-shadow:0 6px 18px rgba(139,126,200,0.15);border-radius:8px;",
        formatter: function(arr){
          const list = Array.isArray(arr) ? arr : [arr];
          const g = list.find(q => q.seriesName === "变形函数");
          const f = list.find(q => q.seriesName === "母函数");
          if(!g || !g.value || g.value[1] == null) return "";
          return '<div style="min-width:150px">x = ' + fmt(g.value[0]) + '<br>' +
            '<span style="color:' + gray + '">母 f(x) = ' + (f && f.value[1] != null ? fmt(f.value[1]) : "—") + '</span><br>' +
            '<b style="color:' + accent + '">变形 g(x) = ' + fmt(g.value[1]) + '</b></div>';
        }
      },
      xAxis: Object.assign({}, axisCommon, { type: "value" }),
      yAxis: Object.assign({}, axisCommon, { type: "value" }),
      dataZoom: [
        { type: "inside", xAxisIndex: 0, filterMode: "none", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false },
        { type: "inside", yAxisIndex: 0, filterMode: "none", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false }
      ],
      series: [
        { type: "line", name: "母函数", data: dataF, showSymbol: false, smooth: false, connectNulls: false, silent: true, lineStyle: { color: gray, type: "dashed", width: 1.2 } },
        { type: "line", name: "变形函数", data: dataG, showSymbol: false, smooth: false, connectNulls: false, lineStyle: { color: accent, width: 2 }, areaStyle: { color: { type: "linear", x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: "rgba(139,126,200,0.10)" }, { offset: 1, color: "rgba(139,126,200,0)" }] } } }
      ]
    };
  }

  function autoTransforms(fn){
    return [
      { type: "上下平移", kind: "shiftY", k: 1, formula: String.raw`y=f(x)+1`, desc: String.raw`图像整体上移 $1$ 个单位（上加下减）。`, examples: [String.raw`y=f(x)-2\ \text{下移 }2`] },
      { type: "左右平移", kind: "shiftX", h: 1, formula: String.raw`y=f(x-1)`, desc: String.raw`图像右移 $1$ 个单位（左加右减）。`, examples: [String.raw`y=f(x+2)\ \text{左移 }2`] },
      { type: "纵向伸缩", kind: "scaleY", a: 2, formula: String.raw`y=2f(x)`, desc: String.raw`纵向拉伸为原来的 $2$ 倍。`, examples: [String.raw`y=\dfrac{1}{2}f(x)\ \text{纵向压缩}`] },
      { type: "横向伸缩", kind: "scaleX", a: 2, formula: String.raw`y=f(2x)`, desc: String.raw`横向压缩为原来的 $\dfrac{1}{2}$。`, examples: [String.raw`y=f\left(\dfrac{x}{2}\right)\ \text{横向拉伸}`] },
      { type: "整体加绝对值", kind: "absF", formula: String.raw`y=|f(x)|`, desc: String.raw`把 $x$ 轴下方图像翻到上方。`, examples: [] },
      { type: "自变量加绝对值", kind: "absX", formula: String.raw`y=f(|x|)`, desc: String.raw`保留 $y$ 轴右侧并关于 $y$ 轴对称。`, examples: [] },
      { type: "取负", kind: "negY", formula: String.raw`y=-f(x)`, desc: String.raw`关于 $x$ 轴对称。`, examples: [] },
      { type: "自变量取负", kind: "negX", formula: String.raw`y=f(-x)`, desc: String.raw`关于 $y$ 轴对称。`, examples: [] },
      { type: "与 x 相乘", kind: "times", q: (x) => x, formula: String.raw`y=x\cdot f(x)`, desc: String.raw`与 $x$ 相乘改变零点与函数次数。`, examples: [] },
      { type: "与 x 相除", kind: "div", q: (x) => x, formula: String.raw`y=\dfrac{f(x)}{x}`, desc: String.raw`除以 $x$，在 $x=0$ 处可能产生渐近线。`, examples: [] }
    ];
  }

  function getTransforms(fn){
    if(fn.transforms && fn.transforms.some(t => t.kind || t.gfn)) return fn.transforms;
    return autoTransforms(fn);

  function transformHTML(fn, tr, i){

      (desc ? '<div class="tf-desc">' + esc(desc) + '</div>' : '') +

      el.innerHTML = esc(fn.paramSummary(currentParams));
      typeset(el);
    }else{
      el.style.display = "none";
    }
  }

  function initSliders(fn){
    const box = document.getElementById("sliders");
    if(!fn.params || !Object.keys(fn.params).length){
      box.innerHTML = "";
      box.style.display = "none";
    }else{
      box.style.display = "grid";
      box.innerHTML = Object.keys(fn.params).map(k => {
        const c = fn.params[k];
        return '<label class="slider"><span class="sl-label">' + c.label + "</span>" +
          '<span class="sl-val" id="sl-val-' + k + '">' + fmt(c.default) + "</span>" +
          '<input type="range" min="' + c.min + '" max="' + c.max + '" step="' + c.step + '" value="' + c.default + '" data-key="' + k + '">' +
          "</label>";
      }).join("");
      box.querySelectorAll("input").forEach(inp => {
        paintRange(inp);
        inp.addEventListener("input", () => {
          currentParams[inp.dataset.key] = parseFloat(inp.value);
          document.getElementById("sl-val-" + inp.dataset.key).textContent = fmt(parseFloat(inp.value));
          paintRange(inp);
          updateFeatureSummary(fn);
          if(fullChart) fullChart.rerender();
          transformCharts.forEach(tc => tc.handle.rerender());
        });
      });
    }
    updateFeatureSummary(fn);
  }

  function openModal(id){
    const fn = FUNCTION_DATA.find(f => f.id === id);
    if(!fn) return;
    currentFn = fn;
    currentParams = defaultParams(fn);
    document.getElementById("modal-content").innerHTML = buildModalHTML(fn);
    document.getElementById("modal").hidden = false;
    document.body.classList.add("no-scroll");
    requestAnimationFrame(() => {
      initChartSection(fn);
      initSliders(fn);
      renderTransformCharts(fn);
      typeset(document.getElementById("modal-content"));
    });
  }

  function closeModal(){
    document.getElementById("modal").hidden = true;
    document.body.classList.remove("no-scroll");
    if(fullChart){ fullChart.chart.dispose(); fullChart = null; }
    transformCharts.forEach(tc => tc.handle.chart.dispose());
    transformCharts.length = 0;
    currentFn = null;
  }

  /* =========================================================
     切线型不等式（独立板块）
  ========================================================= */
  const TANGENT_INEQUALITIES = [
    {
      id: "te_exp_x1", formula: String.raw`e^x \ge x+1`,
      condition: String.raw`当且仅当 $x=0$ 时取等`, usage: "指数函数在 x=0 处的切线 y=x+1 是其下界，用于含 e^x 的最值与恒成立放缩。",
      xRange: [-3, 3], yClip: 12, yRange: [-2, 9], point: { x: 0, y: 1, label: "切点 (0,1)" },
      curves: [{ name: "目标函数", fn: (x) => Math.exp(x) }, { name: "对照函数", fn: (x) => x + 1 }]
    },
    {
      id: "te_exp_ex", formula: String.raw`e^x \ge ex`,
      condition: String.raw`当且仅当 $x=1$ 时取等`, usage: "e^x 在 x=1 处的切线 y=ex 是其下界，可得 $\dfrac{e^x}{x}\ge e$（x>0）。",
      xRange: [-2, 3], yClip: 14, yRange: [-2, 10], point: { x: 1, y: Math.E, label: "切点 (1,e)" },
      curves: [{ name: "目标函数", fn: (x) => Math.exp(x) }, { name: "对照函数", fn: (x) => Math.E * x }]
    },
    {
      id: "te_exp_1over", formula: String.raw`e^x \le \dfrac{1}{1-x}\ (x<1)`,
      condition: String.raw`当且仅当 $x=0$ 时取等`, usage: "用几何级数 $\dfrac{1}{1-x}=1+x+x^2+\cdots$ 的上界估计 e^x，用于 x<1 的放缩。",
      xRange: [-2, 0.9], yClip: 10, yRange: [0, 8], point: { x: 0, y: 1, label: "交点 (0,1)" },
      curves: [{ name: "目标函数", fn: (x) => Math.exp(x) }, { name: "对照函数", fn: (x) => 1 / (1 - x) }]
    },
    {
      id: "te_lnx_x1", formula: String.raw`\ln x \le x-1`,
      condition: String.raw`当且仅当 $x=1$ 时取等`, usage: "对数函数在 x=1 处的切线 y=x−1 是其上界，是最常用的对数切线放缩。",
      xRange: [0.1, 5], yClip: 5, yRange: [-4, 4], point: { x: 1, y: 0, label: "切点 (1,0)" },
      curves: [{ name: "目标函数", fn: (x) => Math.log(x) }, { name: "对照函数", fn: (x) => x - 1 }]
    },
    {
      id: "te_lnx_1overx", formula: String.raw`\ln x \ge 1-\dfrac{1}{x}`,
      condition: String.raw`当且仅当 $x=1$ 时取等`, usage: "对数在 x=1 处的另一条下界曲线 y=1−1/x，用于放缩 $\ln x$ 的下界。",
      xRange: [0.3, 5], yClip: 6, yRange: [-4, 2], point: { x: 1, y: 0, label: "切点 (1,0)" },
      curves: [{ name: "目标函数", fn: (x) => Math.log(x) }, { name: "对照函数", fn: (x) => 1 - 1 / x }]
    },
    {
      id: "te_lnx_pade1", formula: String.raw`\ln x \le \dfrac{2(x-1)}{x+1}\ (0<x\le 1)`,
      condition: String.raw`当且仅当 $x=1$ 时取等`, usage: "帕德型下界估计，比线性放缩更精细，用于 $(0,1]$ 上的对数放缩。",
      xRange: [0.05, 1.1], yClip: 6, yRange: [-6, 1], point: { x: 1, y: 0, label: "切点 (1,0)" },
      curves: [{ name: "目标函数", fn: (x) => Math.log(x) }, { name: "对照函数", fn: (x) => 2 * (x - 1) / (x + 1) }]
    },
    {
      id: "te_lnx_pade2", formula: String.raw`\ln x \ge \dfrac{2(x-1)}{x+1}\ (x\ge 1)`,
      condition: String.raw`当且仅当 $x=1$ 时取等`, usage: "帕德型上界估计，用于 $[1,+\infty)$ 上对数与有理式的比较。",
      xRange: [0.9, 6], yClip: 4, yRange: [-2, 2], point: { x: 1, y: 0, label: "切点 (1,0)" },
      curves: [{ name: "目标函数", fn: (x) => Math.log(x) }, { name: "对照函数", fn: (x) => 2 * (x - 1) / (x + 1) }]
    },
    {
      id: "te_sin_x_tan", formula: String.raw`\sin x < x < \tan x\ \left(0<x<\dfrac{\pi}{2}\right)`,
      condition: String.raw`开区间内严格成立，无取等点（三者在 $x\to0^+$ 时汇于 $0$）`, usage: "三角函数的经典夹逼式，常用于证明 $\lim_{x\to0}\dfrac{\sin x}{x}=1$。",
      xRange: [0.02, 1.45], yClip: 8, yRange: [-0.3, 8], point: null,
      curves: [{ name: "目标函数", fn: (x) => x }, { name: "下界", fn: (x) => Math.sin(x) }, { name: "上界", fn: (x) => Math.tan(x) }]
    },
    {
      id: "te_x1_lnx", formula: String.raw`x-1 \ge \ln x`,
      condition: String.raw`当且仅当 $x=1$ 时取等`, usage: "与 $\ln x\le x-1$ 等价，强调「直线在上、对数在下」。",
      xRange: [0.1, 5], yClip: 5, yRange: [-4, 4], point: { x: 1, y: 0, label: "切点 (1,0)" },
      curves: [{ name: "目标函数", fn: (x) => x - 1 }, { name: "对照函数", fn: (x) => Math.log(x) }]
    },
    {
      id: "te_xoverE_lnx", formula: String.raw`\dfrac{x}{e} \ge \ln x`,
      condition: String.raw`当且仅当 $x=e$ 时取等`, usage: "等价于 $\dfrac{\ln x}{x}\le\dfrac{1}{e}$，用于比较 $\ln x$ 与 $\dfrac{x}{e}$。",
      xRange: [0.1, 6], yClip: 4, yRange: [-3, 3], point: { x: Math.E, y: 1, label: "切点 (e,1)" },
      curves: [{ name: "目标函数", fn: (x) => x / Math.E }, { name: "对照函数", fn: (x) => Math.log(x) }]
    },
    {
      id: "te_exp_ex2", formula: String.raw`e^x \ge ex`,
      condition: String.raw`当且仅当 $x=1$ 时取等`, usage: "即 $e^{x-1}\ge x$，常用于把指数项与线性项比较。",
      xRange: [-2, 3], yClip: 14, yRange: [-2, 10], point: { x: 1, y: Math.E, label: "切点 (1,e)" },
      curves: [{ name: "目标函数", fn: (x) => Math.exp(x) }, { name: "对照函数", fn: (x) => Math.E * x }]
    }
  ];

  function buildTangentChartOption(t){
    const accent = "#8B7EC8", gray = "#C7C2D6";
    const xr = t.xRange, clip = t.yClip != null ? t.yClip : Infinity, N = 300;
    const series = t.curves.map((c, idx) => {
      const data = [];
      for(let i = 0; i <= N; i++){
        const x = xr[0] + (xr[1] - xr[0]) * i / N;
        const xf = Math.round(x * 1e6) / 1e6;
        const y = c.fn(x);
        data.push(isFinite(y) && Math.abs(y) <= clip ? [xf, Math.round(y * 1e6) / 1e6] : [xf, null]);
      }
      const primary = idx === 0;
      return {
        type: "line", name: c.name, data: data, showSymbol: false, smooth: false, connectNulls: false,
        silent: !primary,
        lineStyle: { color: primary ? accent : gray, type: primary ? "solid" : "dashed", width: primary ? 2.2 : 1.3 }
      };
    });
    if(t.point){
      series[0].markPoint = {
        animation: false,
        data: [{ name: t.point.label, coord: [t.point.x, t.point.y], symbol: "circle", symbolSize: 9, itemStyle: { color: accent, borderColor: "#fff", borderWidth: 2 }, label: { show: true, color: "#6B6680", fontSize: 10, position: "bottom", formatter: t.point.label } }]
      };
    }
    const axisCommon = { axisLine: { lineStyle: { color: "#D8D2E6", width: 1 } }, axisLabel: { color: "#9A94AD", fontSize: 10 }, axisTick: { show: false }, splitLine: { show: false } };
    return {
      animation: false, backgroundColor: "transparent",
      grid: { left: 34, right: 12, top: 14, bottom: 26 },
      tooltip: {
        trigger: "axis", confine: true, backgroundColor: "rgba(255,255,255,0.97)", borderColor: accent, borderWidth: 1, padding: [6, 8], textStyle: { color: "#1D1A2A", fontSize: 11 }, extraCssText: "box-shadow:0 6px 18px rgba(139,126,200,0.15);border-radius:8px;",
        formatter: function(arr){
          const list = Array.isArray(arr) ? arr : [arr];
          const first = list[0];
          if(!first || !first.value || first.value[1] == null) return "";
          let s = '<div style="min-width:160px">x = ' + fmt(first.value[0]);
          list.forEach(q => { if(q.value && q.value[1] != null) s += '<br><span style="color:' + (q.color || gray) + '">' + q.seriesName + ' = ' + fmt(q.value[1]) + '</span>'; });
          return s + '</div>';
        }
      },
      xAxis: Object.assign({}, axisCommon, { type: "value" }),
      yAxis: Object.assign({}, axisCommon, { type: "value" }),
      dataZoom: [
        { type: "inside", xAxisIndex: 0, filterMode: "none", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false },
        { type: "inside", yAxisIndex: 0, filterMode: "none", zoomOnMouseWheel: true, moveOnMouseMove: true, moveOnMouseWheel: false }
      ],
      series: series
    };
  }

  function renderTangentSection(){
    tangentCharts.forEach(h => h.chart.dispose());
    tangentCharts.length = 0;
    const grid = document.getElementById("tangent-grid");
    if(!grid) return;
    grid.innerHTML = TANGENT_INEQUALITIES.map(t =>
      '<article class="tangent-card">' +
        '<div class="tangent-formula">$$' + esc(t.formula) + '$$</div>' +
        '<div class="tangent-chart" id="tangent-chart-' + t.id + '"></div>' +
        '<div class="tangent-cond">取等条件：' + esc(t.condition) + '</div>' +
        '<div class="tangent-usage">' + esc(t.usage) + '</div>' +
      '</article>'
    ).join("");
    if(typeof echarts !== "undefined"){
      TANGENT_INEQUALITIES.forEach(t => {
        const host = document.getElementById("tangent-chart-" + t.id);
        if(host){ tangentCharts.push(makeZoomableChart(host, (xMin, xMax) => buildTangentRangeOption(t, xMin, xMax), t.xRange)); }
      });
    }
    typeset(grid);
  }

  /* =========================================================
     事件绑定与启动
  ========================================================= */
  document.getElementById("search-input").addEventListener("input", e => {
    searchQuery = e.target.value;
    renderGrid();
  });

  document.getElementById("grid").addEventListener("click", e => {
    const card = e.target.closest(".card");
    if(card) openModal(card.dataset.id);
  });

  document.getElementById("modal-close").addEventListener("click", closeModal);
  document.getElementById("modal-backdrop").addEventListener("click", closeModal);
  document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

  renderCategories();
  renderGrid();
  renderTangentSection();
  typesetWhenReady();
  window.addEventListener("resize", () => {
    if(fullChart) fullChart.chart.resize();
    transformCharts.forEach(tc => tc.handle.chart.resize());
    tangentCharts.forEach(h => h.chart.resize());
  });
  </script>
</body>
